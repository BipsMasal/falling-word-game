    <style>

        /* ================================
           BASIC RESET
        ================================= */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111827;

            color: white;

            overflow: hidden;
        }


        /* ================================
           TOP BAR
        ================================= */

        #topBar {

            height: 70px;

            display: flex;

            justify-content: space-around;

            align-items: center;

            background: #1f2937;

            font-size: 20px;

            font-weight: bold;

            border-bottom: 2px solid #374151;
        }


        #topBar div {

            min-width: 100px;

            text-align: center;
        }


        /* ================================
           GAME AREA
        ================================= */

        #gameArea {

            position: relative;

            height:
                calc(100vh - 70px);

            overflow: hidden;

            border-bottom:
                5px solid #ef4444;
        }


        /* ================================
           FALLING WORD
        ================================= */

        .word {

            position: absolute;

            top: 0;

            padding:
                8px 14px;

            background: #2563eb;

            border-radius: 8px;

            font-size: 22px;

            font-weight: bold;

            user-select: none;

            white-space: nowrap;

            box-shadow:
                0 4px 10px
                rgba(0, 0, 0, 0.3);

            transition:
                transform 0.1s;
        }


        .word:hover {

            transform:
                scale(1.05);
        }


        /* ================================
           INPUT AREA
        ================================= */

        #inputContainer {

            position: absolute;

            bottom: 30px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 100;
        }


        #wordInput {

            width: 350px;

            max-width: 80vw;

            padding: 15px;

            font-size: 22px;

            text-align: center;

            border:
                3px solid #2563eb;

            border-radius: 10px;

            outline: none;

            background: white;

            color: #111827;
        }


        #wordInput:focus {

            border-color:
                #22c55e;
        }


        /* ================================
           OVERLAY
        ================================= */

        #overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.88);

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            z-index: 200;

            text-align: center;

            padding: 20px;
        }


        #overlay h1 {

            font-size: 52px;

            margin:
                0 0 15px;
        }


        #overlay p {

            font-size: 20px;

            margin-bottom: 30px;

            color: #d1d5db;
        }


        /* ================================
           BUTTON
        ================================= */

        button {

            padding:
                14px 32px;

            font-size: 20px;

            font-weight: bold;

            border: none;

            border-radius: 8px;

            background: #22c55e;

            color: white;

            cursor: pointer;

            transition:
                transform 0.1s,
                background 0.2s;
        }


        button:hover {

            background:
                #16a34a;

            transform:
                scale(1.05);
        }


        /* ================================
           HIDDEN
        ================================= */

        .hidden {

            display: none !important;
        }


        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 600px) {

            #topBar {

                height: 60px;

                font-size: 16px;
            }


            #gameArea {

                height:
                    calc(100vh - 60px);
            }


            .word {

                font-size: 17px;

                padding:
                    6px 10px;
            }


            #wordInput {

                width: 280px;

                font-size: 18px;

                padding: 12px;
            }


            #overlay h1 {

                font-size: 38px;
            }
        }

    </style>

</head>


<body>


    <!-- =================================

    <!-- =================================

    <script>


        // =================================
        // WORD LISTS
        // =================================


        const wordLists = {

            // -----------------------------

            6: [

            ]

        };


        // =================================
        // GAME VARIABLES
        // =================================


        let score = 0;

        let lives = 3;

        let level = 1;

        let speed = 1;

        let gameRunning = false;

        let spawnInterval = null;

        let gameLoop = null;

        let previousWord = "";


        // Maximum words allowed on screen

        const MAX_WORDS = 8;


        // =================================
        // HTML ELEMENTS
        // =================================


        const gameArea =
            document.getElementById(
                "gameArea"
            );


        const wordInput =
            document.getElementById(
                "wordInput"
            );


        const scoreDisplay =
            document.getElementById(
                "score"
            );


        const livesDisplay =
            document.getElementById(
                "lives"
            );


        const levelDisplay =
            document.getElementById(
                "level"
            );


        const bestScoreDisplay =
            document.getElementById(
                "bestScore"
            );


        const overlay =
            document.getElementById(
                "overlay"
            );


        const overlayTitle =
            document.getElementById(
                "overlayTitle"
            );


        const overlayMessage =
            document.getElementById(
                "overlayMessage"
            );


        const startButton =
            document.getElementById(
                "startButton"
            );


        // =================================
        // BEST SCORE
        // =================================


        let bestScore =
            Number(
                localStorage.getItem(
                    "fallingWordBestScore"
                )
            ) || 0;


        bestScoreDisplay.textContent =
            bestScore;


        // =================================
        // START GAME
        // =================================


        function startGame() {


            // Reset game

            score = 0;

            lives = 3;

            level = 1;

            speed = 1;

            previousWord = "";

            gameRunning = true;


            // Clear old timers

            clearInterval(
                spawnInterval
            );


            cancelAnimationFrame(
                gameLoop
            );


            // Remove old words

            document
                .querySelectorAll(".word")
                .forEach(word => {

                    word.remove();

                });


            // Update UI

            scoreDisplay.textContent =
                score;

            livesDisplay.textContent =
                lives;

            levelDisplay.textContent =
                level;


            // Hide overlay

            overlay.classList.add(
                "hidden"
            );


            // Clear input

            wordInput.value = "";


            // Focus input

            wordInput.focus();


            // Start spawning

            spawnInterval =
                setInterval(
                    spawnWords,
                    getSpawnTime()
                );


            // Start game loop

            gameLoop =
                requestAnimationFrame(
                    updateGame
                );

        }


        // =================================
        // RANDOM WORD
        // =================================


        function getRandomWord() {


            // Maximum difficulty = 6

            const difficulty =
                Math.min(
                    level,
                    6
                );


            const currentList =
                wordLists[difficulty];


            let selectedWord;


            // Avoid immediate duplicate

            do {

                const randomIndex =
                    Math.floor(
                        Math.random() *
                        currentList.length
                    );


                selectedWord =
                    currentList[randomIndex];


            } while (

                selectedWord ===
                previousWord &&

                currentList.length > 1

            );


            previousWord =
                selectedWord;


            return selectedWord;

        }


        // =================================
        // SPAWN WORDS
        // =================================


        function spawnWords() {


            if (!gameRunning) {
                return;
            }


            // Number of words increases
            // as level increases

            const wordCount =
                Math.min(
                    1 +
                    Math.floor(level / 2),
                    4
                );


            for (
                let i = 0;
                i < wordCount;
                i++
            ) {


                setTimeout(
                    () => {

                        if (
                            gameRunning
                        ) {

                            createWord();

                        }

                    },

                    i * 150

                );

            }

        }


        // =================================
        // CREATE WORD
        // =================================


        function createWord() {


            if (!gameRunning) {
                return;
            }


            // Prevent too many words

            const currentWordCount =
                document
                    .querySelectorAll(
                        ".word"
                    )
                    .length;


            if (
                currentWordCount >=
                MAX_WORDS
            ) {

                return;

            }


            // Create element

            const word =
                document.createElement(
                    "div"
                );


            word.classList.add(
                "word"
            );


            // Random word

            word.textContent =
                getRandomWord();


            // Find position

            const maxX =
                Math.max(
                    20,
                    gameArea.clientWidth -
                    200
                );


            let randomX;

            let attempts = 0;


            do {

                randomX =
                    Math.random() *
                    maxX;


                attempts++;


            } while (

                isPositionTooClose(
                    randomX
                ) &&

                attempts < 10

            );


            // Set horizontal position

            word.style.left =
                randomX + "px";


            // Set vertical position

            word.dataset.y = "0";


            // Add to game

            gameArea.appendChild(
                word
            );

        }


        // =================================
        // CHECK WORD POSITION
        // =================================


        function isPositionTooClose(
            newX
        ) {


            const existingWords =
                document.querySelectorAll(
                    ".word"
                );


            for (
                const word
                of existingWords
            ) {


                const existingX =
                    parseFloat(
                        word.style.left
                    );


                if (
                    Math.abs(
                        newX -
                        existingX
                    ) < 130
                ) {

                    return true;

                }

            }


            return false;

        }


        // =================================
        // GAME LOOP
        // =================================


        function updateGame() {


            if (!gameRunning) {
                return;
            }


            const fallingWords =
                document.querySelectorAll(
                    ".word"
                );


            fallingWords.forEach(
                word => {


                    let y =
                        parseFloat(
                            word.dataset.y
                        );


                    // Move downward

                    y += speed;


                    word.dataset.y =
                        y;


                    word.style.top =
                        y + "px";


                    // Bottom boundary

                    const bottomLimit =
                        gameArea.clientHeight -
                        100;


                    if (
                        y >
                        bottomLimit
                    ) {


                        word.remove();


                        loseLife();

                    }

                }
            );


            // Continue animation

            gameLoop =
                requestAnimationFrame(
                    updateGame
                );

        }


        // =================================
        // INPUT / TYPING
        // =================================


        wordInput.addEventListener(
            "input",
            function () {


                if (!gameRunning) {
                    return;
                }


                const typedWord =
                    wordInput.value
                        .trim()
                        .toLowerCase();


                if (
                    typedWord === ""
                ) {

                    return;

                }


                const fallingWords =
                    document.querySelectorAll(
                        ".word"
                    );


                fallingWords.forEach(
                    word => {


                        const currentWord =
                            word.textContent
                                .toLowerCase();


                        if (
                            typedWord ===
                            currentWord
                        ) {


                            // Remove word

                            word.remove();


                            // Add score

                            score += 10;


                            scoreDisplay
                                .textContent =
                                score;


                            // Clear input

                            wordInput.value =
                                "";


                            // Level check

                            increaseLevel();

                        }

                    }
                );

            }
        );


        // =================================
        // LOSE LIFE
        // =================================


        function loseLife() {


            if (!gameRunning) {
                return;
            }


            lives--;


            livesDisplay
                .textContent =
                lives;


            if (
                lives <= 0
            ) {

                gameOver();

            }

        }


        // =================================
        // LEVEL SYSTEM
        // =================================


        function increaseLevel() {


            const newLevel =
                Math.floor(
                    score / 50
                ) + 1;


            if (
                newLevel > level
            ) {


                level =
                    newLevel;


                levelDisplay
                    .textContent =
                    level;


                // Increase speed

                speed += 0.5;


                // Restart spawning

                clearInterval(
                    spawnInterval
                );


                spawnInterval =
                    setInterval(
                        spawnWords,
                        getSpawnTime()
                    );

            }

        }


        // =================================
        // SPAWN SPEED
        // =================================


        function getSpawnTime() {


            const baseTime =
                1500;


            const reduction =
                (level - 1) *
                150;


            return Math.max(
                500,
                baseTime -
                reduction
            );

        }


        // =================================
        // GAME OVER
        // =================================


        function gameOver() {


            gameRunning =
                false;


            // Stop timers

            clearInterval(
                spawnInterval
            );


            cancelAnimationFrame(
                gameLoop
            );


            // Update best score

            if (
                score >
                bestScore
            ) {


                bestScore =
                    score;


                localStorage.setItem(
                    "fallingWordBestScore",
                    bestScore
                );


                bestScoreDisplay
                    .textContent =
                    bestScore;

            }


            // Game Over screen

            overlayTitle.textContent =
                "Game Over";


            overlayMessage.textContent =
                `Score: ${score} | Best: ${bestScore}`;


            startButton.textContent =
                "Play Again";


            overlay.classList.remove(
                "hidden"
            );

        }


        // =================================
        // START BUTTON
        // =================================


        startButton.addEventListener(
            "click",
            startGame
        );


        // =================================
        // ENTER KEY TO START
        // =================================


        document.addEventListener(
            "keydown",
            function(event) {


                if (
                    event.key ===
                    "Enter" &&

                    !gameRunning
                ) {

                    startGame();

                }

            }
        );


    </script>
