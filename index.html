<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Word Typing Game</title>

    <style>
        /* ================================
           BASIC RESET
        ================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #111827;
            color: white;
            overflow: hidden;
        }

        /* ================================
           TOP BAR
        ================================= */

        #topBar {
            height: 70px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #1f2937;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid #374151;
        }

        #topBar div {
            min-width: 100px;
            text-align: center;
        }

        /* ================================
           GAME AREA
        ================================= */

        #gameArea {
            position: relative;
            height: calc(100vh - 70px);
            overflow: hidden;
            border-bottom: 5px solid #ef4444;
        }

        /* ================================
           FALLING WORD
        ================================= */

        .word {
            position: absolute;
            top: 0;
            padding: 8px 14px;
            background: #2563eb;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            user-select: none;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s;
        }

        .word:hover {
            transform: scale(1.05);
        }

        /* ================================
           INPUT AREA
        ================================= */

        #inputContainer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        #wordInput {
            width: 350px;
            max-width: 80vw;
            padding: 15px;
            font-size: 22px;
            text-align: center;
            border: 3px solid #2563eb;
            border-radius: 10px;
            outline: none;
            background: white;
            color: #111827;
        }

        #wordInput:focus {
            border-color: #22c55e;
        }

        /* ================================
           OVERLAY
        ================================= */

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            text-align: center;
            padding: 20px;
        }

        #overlay h1 {
            font-size: 52px;
            margin: 0 0 15px;
        }

        #overlay p {
            font-size: 20px;
            margin-bottom: 30px;
            color: #d1d5db;
        }

        /* ================================
           BUTTON
        ================================= */

        button {
            padding: 14px 32px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover {
            background: #16a34a;
            transform: scale(1.05);
        }

        /* ================================
           HIDDEN
        ================================= */

        .hidden {
            display: none !important;
        }

        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 600px) {
            #topBar {
                height: 60px;
                font-size: 16px;
            }

            #gameArea {
                height: calc(100vh - 60px);
            }

            .word {
                font-size: 17px;
                padding: 6px 10px;
            }

            #wordInput {
                width: 280px;
                font-size: 18px;
                padding: 12px;
            }

            #overlay h1 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <!-- =================================
         TOP INFORMATION BAR
    ================================== -->

    <div id="topBar">

        <div>
            Score:
            <span id="score">0</span>
        </div>

        <div>
            Lives:
            <span id="lives">3</span>
        </div>

        <div>
            Level:
            <span id="level">1</span>
        </div>

        <div>
            Best:
            <span id="bestScore">0</span>
        </div>

    </div>


    <!-- =================================
         GAME AREA
    ================================== -->

    <div id="gameArea">

        <!-- Typing input -->
        <div id="inputContainer">

            <input
                type="text"
                id="wordInput"
                placeholder="Type the falling word..."
                autocomplete="off"
                spellcheck="false"
            >

        </div>

    </div>


    <!-- =================================
         START / GAME OVER SCREEN
    ================================== -->

    <div id="overlay">

        <h1 id="overlayTitle">
            Falling Words
        </h1>

        <p id="overlayMessage">
            Type the falling words before they reach the bottom!
        </p>

        <button id="startButton">
            Start Game
        </button>

    </div>


    <script>

        // =================================
        // WORD LISTS
        // =================================

        const wordLists = {

            // LEVEL 1
            1: [
                "cat",
                "dog",
                "sun",
                "book",
                "tree",
                "car",
                "game",
                "ball",
                "fish",
                "home",
                "red",
                "blue",
                "run",
                "jump",
                "fast",
                "slow",
                "star",
                "moon",
                "road",
                "door",
                "pen",
                "cup",
                "box",
                "key",
                "map",
                "hat",
                "milk",
                "food",
                "rain",
                "wind"
            ],

            // LEVEL 2
            2: [
                "apple",
                "house",
                "mouse",
                "water",
                "green",
                "phone",
                "table",
                "chair",
                "world",
                "music",
                "school",
                "paper",
                "happy",
                "light",
                "river",
                "plant",
                "animal",
                "people",
                "winter",
                "summer",
                "orange",
                "window",
                "garden",
                "friend",
                "family",
                "computer",
                "screen",
                "keyboard",
                "camera",
                "mobile"
            ],

            // LEVEL 3
            3: [
                "banana",
                "orange",
                "coding",
                "browser",
                "computer",
                "testing",
                "keyboard",
                "quality",
                "website",
                "program",
                "internet",
                "developer",
                "software",
                "database",
                "network",
                "service",
                "project",
                "system",
                "button",
                "random",
                "number",
                "future",
                "design",
                "application",
                "message",
                "password",
                "account",
                "profile",
                "storage",
                "response"
            ],

            // LEVEL 4
            4: [
                "javascript",
                "developer",
                "automation",
                "playwright",
                "software",
                "function",
                "variable",
                "frontend",
                "database",
                "backend",
                "framework",
                "component",
                "interface",
                "performance",
                "security",
                "testing",
                "browser",
                "deployment",
                "repository",
                "github",
                "element",
                "selector",
                "response",
                "request",
                "authentication",
                "validation",
                "configuration",
                "programming",
                "technology",
                "application"
            ],

            // LEVEL 5
            5: [
                "programming",
                "application",
                "configuration",
                "development",
                "performance",
                "authentication",
                "implementation",
                "architecture",
                "optimization",
                "authorization",
                "accessibility",
                "integration",
                "documentation",
                "infrastructure",
                "environment",
                "deployment",
                "functionality",
                "compatibility",
                "responsibility",
                "communication",
                "management",
                "administrator",
                "cybersecurity",
                "transaction",
                "visualization",
                "productivity",
                "intelligence",
                "international",
                "information",
                "engineering"
            ],

            // LEVEL 6
            6: [
                "microservices",
                "authentication",
                "authorization",
                "configuration",
                "infrastructure",
                "implementation",
                "documentation",
                "optimization",
                "compatibility",
                "accessibility",
                "functionality",
                "architecture",
                "communication",
                "virtualization",
                "transformation",
                "synchronization",
                "serialization",
                "cryptography",
                "orchestration",
                "containerization",
                "reliability",
                "availability",
                "observability",
                "cybersecurity",
                "interoperability",
                "internationalization",
                "responsiveness",
                "maintainability",
                "scalability",
                "configuration"
            ]
        };


        // =================================
        // GAME VARIABLES
        // =================================

        let score = 0;
        let lives = 3;
        let level = 1;
        let speed = 1;

        let gameRunning = false;

        let spawnInterval = null;
        let gameLoop = null;

        let previousWord = "";

        const MAX_WORDS = 8;


        // =================================
        // HTML ELEMENTS
        // =================================

        const gameArea =
            document.getElementById("gameArea");

        const wordInput =
            document.getElementById("wordInput");

        const scoreDisplay =
            document.getElementById("score");

        const livesDisplay =
            document.getElementById("lives");

        const levelDisplay =
            document.getElementById("level");

        const bestScoreDisplay =
            document.getElementById("bestScore");

        const overlay =
            document.getElementById("overlay");

        const overlayTitle =
            document.getElementById("overlayTitle");

        const overlayMessage =
            document.getElementById("overlayMessage");

        const startButton =
            document.getElementById("startButton");


        // =================================
        // BEST SCORE
        // =================================

        let bestScore =
            Number(
                localStorage.getItem(
                    "fallingWordBestScore"
                )
            ) || 0;

        bestScoreDisplay.textContent =
            bestScore;


        // =================================
        // START GAME
        // =================================

        function startGame() {

            score = 0;
            lives = 3;
            level = 1;
            speed = 1;
            previousWord = "";

            gameRunning = true;

            clearInterval(spawnInterval);

            cancelAnimationFrame(gameLoop);

            document
                .querySelectorAll(".word")
                .forEach(word => {
                    word.remove();
                });

            scoreDisplay.textContent =
                score;

            livesDisplay.textContent =
                lives;

            levelDisplay.textContent =
                level;

            overlay.classList.add("hidden");

            wordInput.value = "";

            wordInput.focus();

            spawnInterval =
                setInterval(
                    spawnWords,
                    getSpawnTime()
                );

            gameLoop =
                requestAnimationFrame(
                    updateGame
                );
        }


        // =================================
        // RANDOM WORD
        // =================================

        function getRandomWord() {

            const difficulty =
                Math.min(level, 6);

            const currentList =
                wordLists[difficulty];

            let selectedWord;

            do {

                const randomIndex =
                    Math.floor(
                        Math.random() *
                        currentList.length
                    );

                selectedWord =
                    currentList[randomIndex];

            } while (
                selectedWord === previousWord &&
                currentList.length > 1
            );

            previousWord =
                selectedWord;

            return selectedWord;
        }


        // =================================
        // SPAWN WORDS
        // =================================

        function spawnWords() {

            if (!gameRunning) {
                return;
            }

            const wordCount =
                Math.min(
                    1 + Math.floor(level / 2),
                    4
                );

            for (
                let i = 0;
                i < wordCount;
                i++
            ) {

                setTimeout(
                    () => {

                        if (gameRunning) {
                            createWord();
                        }

                    },
                    i * 150
                );
            }
        }


        // =================================
        // CREATE WORD
        // =================================

        function createWord() {

            if (!gameRunning) {
                return;
            }

            const currentWordCount =
                document
                    .querySelectorAll(".word")
                    .length;

            if (
                currentWordCount >=
                MAX_WORDS
            ) {
                return;
            }

            const word =
                document.createElement("div");

            word.classList.add("word");

            word.textContent =
                getRandomWord();

            const maxX =
                Math.max(
                    20,
                    gameArea.clientWidth - 200
                );

            let randomX;
            let attempts = 0;

            do {

                randomX =
                    Math.random() *
                    maxX;

                attempts++;

            } while (
                isPositionTooClose(randomX) &&
                attempts < 10
            );

            word.style.left =
                randomX + "px";

            word.dataset.y = "0";

            gameArea.appendChild(word);
        }


        // =================================
        // CHECK WORD POSITION
        // =================================

        function isPositionTooClose(newX) {

            const existingWords =
                document.querySelectorAll(".word");

            for (
                const word of existingWords
            ) {

                const existingX =
                    parseFloat(
                        word.style.left
                    );

                if (
                    Math.abs(
                        newX - existingX
                    ) < 130
                ) {
                    return true;
                }
            }

            return false;
        }


        // =================================
        // GAME LOOP
        // =================================

        function updateGame() {

            if (!gameRunning) {
                return;
            }

            const fallingWords =
                document.querySelectorAll(".word");

            fallingWords.forEach(word => {

                let y =
                    parseFloat(
                        word.dataset.y
                    );

                y += speed;

                word.dataset.y =
                    y;

                word.style.top =
                    y + "px";

                const bottomLimit =
                    gameArea.clientHeight - 100;

                if (
                    y > bottomLimit
                ) {

                    word.remove();

                    loseLife();
                }

            });

            gameLoop =
                requestAnimationFrame(
                    updateGame
                );
        }


        // =================================
        // INPUT / TYPING
        // =================================

        wordInput.addEventListener(
            "input",
            function () {

                if (!gameRunning) {
                    return;
                }

                const typedWord =
                    wordInput.value
                        .trim()
                        .toLowerCase();

                if (typedWord === "") {
                    return;
                }

                const fallingWords =
                    document.querySelectorAll(".word");

                fallingWords.forEach(word => {

                    const currentWord =
                        word.textContent
                            .toLowerCase();

                    if (
                        typedWord === currentWord
                    ) {

                        word.remove();

                        score += 10;

                        scoreDisplay.textContent =
                            score;

                        wordInput.value = "";

                        increaseLevel();
                    }

                });

            }
        );


        // =================================
        // LOSE LIFE
        // =================================

        function loseLife() {

            if (!gameRunning) {
                return;
            }

            lives--;

            livesDisplay.textContent =
                lives;

            if (lives <= 0) {
                gameOver();
            }
        }


        // =================================
        // LEVEL SYSTEM
        // =================================

        function increaseLevel() {

            const newLevel =
                Math.floor(score / 50) + 1;

            if (
                newLevel > level
            ) {

                level =
                    newLevel;

                levelDisplay.textContent =
                    level;

                speed += 0.5;

                clearInterval(
                    spawnInterval
                );

                spawnInterval =
                    setInterval(
                        spawnWords,
                        getSpawnTime()
                    );
            }
        }


        // =================================
        // SPAWN SPEED
        // =================================

        function getSpawnTime() {

            const baseTime = 1500;

            const reduction =
                (level - 1) * 150;

            return Math.max(
                500,
                baseTime - reduction
            );
        }


        // =================================
        // GAME OVER
        // =================================

        function gameOver() {

            gameRunning = false;

            clearInterval(
                spawnInterval
            );

            cancelAnimationFrame(
                gameLoop
            );

            if (
                score > bestScore
            ) {

                bestScore =
                    score;

                localStorage.setItem(
                    "fallingWordBestScore",
                    bestScore
                );

                bestScoreDisplay.textContent =
                    bestScore;
            }

            overlayTitle.textContent =
                "Game Over";

            overlayMessage.textContent =
                `Score: ${score} | Best: ${bestScore}`;

            startButton.textContent =
                "Play Again";

            overlay.classList.remove(
                "hidden"
            );
        }


        // =================================
        // START BUTTON
        // =================================

        startButton.addEventListener(
            "click",
            startGame
        );


        // =================================
        // ENTER KEY TO START
        // =================================

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !gameRunning
                ) {

                    startGame();
                }
            }
        );

    </script>

</body>
</html>
